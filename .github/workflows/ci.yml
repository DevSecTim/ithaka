name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ithaka
          POSTGRES_PASSWORD: ithaka
          POSTGRES_DB: ithaka
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: postgres://ithaka:ithaka@localhost:5432/ithaka
          BETTER_AUTH_SECRET: ci-test-secret-not-for-production
          BETTER_AUTH_URL: http://localhost:3000
      
      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgres://ithaka:ithaka@localhost:5432/ithaka
          BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
      
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://ithaka:ithaka@localhost:5432/ithaka
          BETTER_AUTH_SECRET: ci-test-secret-not-for-production
          BETTER_AUTH_URL: http://localhost:3000
